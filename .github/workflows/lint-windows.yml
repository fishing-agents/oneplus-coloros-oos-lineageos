name: lint windows flasher
on:
  push:
    paths: ["windows/**", ".github/workflows/lint-windows.yml"]
  workflow_dispatch:
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\windows\flash-stock.ps1", [ref]$null, [ref]$e) | Out-Null
          if ($e) { $e | Format-List; exit 1 }
          powershell -NoProfile -Command "`$e=`$null; [System.Management.Automation.Language.Parser]::ParseFile('$PWD\windows\flash-stock.ps1',[ref]`$null,[ref]`$e)|Out-Null; if(`$e){`$e; exit 1}"
          if ($LASTEXITCODE) { exit 1 }
          Write-Host 'parse OK (pwsh 7 + Windows PowerShell 5.1)'
